
workflows:
  realme-android:
    name: Realme Incentive - Android APK
    max_build_duration: 60
    instance_type: linux_x2

    environment:
      node: 22

    scripts:
      - name: Install dependencies
        script: npm install

      - name: Generate Android project
        script: npx cap add android

      - name: Sync Capacitor
        script: npx cap sync android

      - name: Configure Android SDK
        script: echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      - name: Build Android APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

    artifacts:
      - android/app/build/outputs/**/*.apk

  realme-ios:
    name: Realme Incentive - iOS
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      node: 22
      xcode: latest
      cocoapods: default

    scripts:
      - name: Install dependencies
        script: npm install

      - name: Generate iOS project
        script: npx cap add ios

      - name: Sync Capacitor
        script: npx cap sync ios

      - name: Install CocoaPods
        script: |
          cd ios/App
          pod install

      - name: Build iOS
        script: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            build

    artifacts:
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/Products/Debug-iphoneos/*.app
      - /tmp/xcodebuild_logs/*.log
